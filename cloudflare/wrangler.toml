# Latent Legends room server: one Durable Object per room (worker.js). The built game finds it through the address in rooms.url (tools/build_site.sh).
name = "latent-legends-rooms"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

# SQLite backed, so it also runs on the Workers free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Budget"]

[vars]
# pages allowed to open sockets, besides localhost
ORIGINS = "https://latent-legends.vercel.app"
# the ceiling on the bill, per UTC day: past these, players are told online play is full for today.
DAILY_MATCHES = "1500"
DAILY_SOCKETS = "20000"
SOCKETS_PER_IP = "200"
# per address (an IPv6 /64 counts as one): match starts a day, new sockets a minute. An address never gets more than a
# twentieth of the matches left today, whatever MATCHES_PER_IP says.
MATCHES_PER_IP = "120"
SOCKETS_PER_IP_MIN = "40"
# matches an address may end within 45 s of their start (they go back to the day's budget) before it starts no more today
QUICK_PER_IP = "6"
# messages one socket may send; with DAILY_SOCKETS this caps the day's messages
MSGS_PER_SOCKET = "4000"

[observability]
enabled = true
